# Job watcher on the UGREEN NAS — UGOS Docker project `job-hunter`, share docker/job-hunter.
# Sweeps every SWEEP_INTERVAL_HOURS, judges new postings with Claude through the Claude Code CLI
# (`claude -p`, tools disabled), drafts resume + cover letter into ./tailored-auto/, and posts to
# Telegram. Never applies.
#
# Deploy from a git clone (share docker/job-hunter = the repo root):
#   git clone https://github.com/gcjk768/job-hunter.git   # then add the private files below
#   sh deploy/nas/update.sh                               # first start, and every update after
# Private files at the repo root, all gitignored: .env, build/content.py, build/my_profile.py.
# tailored-auto/, build/.nas_state.json and build/backups/ appear on first run.
#
# .env (never commit it):
#   CLAUDE_CODE_OAUTH_TOKEN=...   # from `claude setup-token` on your PC; bills your Claude subscription
#                                 # (or ANTHROPIC_API_KEY=... to bill the API instead)
#   TELEGRAM_BOT_TOKEN=...  TELEGRAM_CHAT_ID=...  TELEGRAM_THREAD_ID=...
#   (optional) IMAP_USER=... IMAP_PASSWORD=...  # read job-alert emails; sharing links to the bot needs none
services:
  job-hunter:
    build: .                           # deploy/nas/Dockerfile, copied next to this file
    image: job-hunter:local
    container_name: job-hunter
    restart: unless-stopped
    working_dir: /app
    env_file:
      - path: ../../.env                 # paths are relative to this file: the repo root is ../..
        required: false
    environment:
      TZ: Asia/Singapore
      PYTHONUNBUFFERED: "1"
      JOB_MODEL: sonnet                # any `claude --model` value: haiku is cheaper, opus is stronger
      SWEEP_INTERVAL_HOURS: "6"          # nights and weekends
      BUSY_INTERVAL_HOURS: "2"           # Mon-Fri during BUSY_HOURS: apply early
      BUSY_HOURS: "8-20"
      MAX_PER_CYCLE: "8"               # caps Claude usage per cycle
      FIT_THRESHOLD: "70"
      URGENT_SCORE: "85"               # alerts at or above this say "apply today"
      FOLLOWUP_DAYS: "7"               # nudge + draft follow-up after /jobapplied with no update
      EXTRACT_MODEL: haiku             # reads alert emails; cheap is fine
      STALL_MIN: "120"                 # no progress this long -> the process exits and Docker restarts it
      HEAL: "1"                        # claude -p diagnoses repeated failures and applies safe fixes
      HEARTBEAT_MIN: "30"              # state-file heartbeat while idle; the healthcheck reads it
      VAULT_DIR: /vault                # Obsidian movement log + memory (build/vault.py); unset = off
    volumes:
      - ../..:/app                       # the code runs from the clone, so `git pull` + restart updates it
      - "/volume1/James/Obsidian/Job Hunter:/vault"   # create it as James first: mkdir -p, else Docker makes it root-owned
    healthcheck:                       # unhealthy if the heartbeat is older than 2h (it refreshes every 30m)
      test: ["CMD", "python", "-c", "import json,datetime as d,sys; s=json.load(open('build/.nas_state.json')); sys.exit((d.datetime.now()-d.datetime.fromisoformat(s['heartbeat'])).total_seconds()>7200)"]
      interval: 10m
      timeout: 20s
      start_period: 3h                 # the first sweep can take a while before anything is written
      retries: 2
